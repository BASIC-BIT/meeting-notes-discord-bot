name: SDD transcription validation

on:
  push:
    branches:
      - "agent/sdd-validation-430-20261021-2208"

permissions:
  contents: read

concurrency:
  group: sdd-transcription-validation-430
  cancel-in-progress: true

env:
  SDD_SOURCE_SHA: "d3b2c32d877d41e8d7b12b91d212d9fb8d739bfb"

jobs:
  focused:
    name: "ASR final legacy mock regressions"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v7
        with:
          ref: "d3b2c32d877d41e8d7b12b91d212d9fb8d739bfb"
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact source
        run: |
          test "$(git rev-parse HEAD)" = "$SDD_SOURCE_SHA"
          git rev-parse HEAD
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24.15.0"
          cache: "yarn"
      - name: Install dependencies
        id: install
        run: bash scripts/ci-install-dependencies.sh
      - name: Exact-source compilation API census
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          if command -v rg >/dev/null 2>&1; then
            rg -n 'compileTranscriptions|cleanupTranscription|cleanupContentTranscription|retainCleanupTranscript' src test
          else
            git grep -n -E 'compileTranscriptions|cleanupTranscription|cleanupContentTranscription|retainCleanupTranscript' -- src test
          fi
      - name: TypeScript build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: yarn build
      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: yarn lint:check
      - name: Format
        id: format
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: yarn prettier:check
      - name: Formatting diagnostics
        if: ${{ !cancelled() && steps.format.outcome == 'failure' }}
        run: |
          trap 'git restore --worktree .' EXIT
          ./node_modules/.bin/prettier --write . --log-level silent
          git diff --no-ext-diff
      - name: Markdown
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: yarn markdownlint:check
      - name: Focused synthetic regressions
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: yarn test --runInBand --coverage=false test/services/transcriptionRequest.test.ts test/observability/transcriptionAttempts.test.ts test/services/transcriptionPolicies.test.ts test/services/openaiClient.test.ts test/observability/langfuseUsageDetails.test.ts test/services/transcriptionSnippetResult.test.ts test/services/transcriptionTracing.test.ts test/services/transcriptionInput.test.ts test/services/meetingProcessingLifetime.test.ts test/commands/endMeetingNotesLatency.test.ts test/services/transcriptionService.test.ts
