name: Sandbox Deployment Identity
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chronote-deploy-sandbox
  cancel-in-progress: false

jobs:
  identity:
    runs-on: ubuntu-latest
    environment: sandbox
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24.15.0"
      - name: Assume Sandbox role with a read-only session
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.SANDBOX_BACKEND_DEPLOY_ROLE_ARN }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: chronote-sandbox-${{ github.run_id }}-${{ github.run_attempt }}
          role-duration-seconds: 900
          aws-region: ${{ vars.AWS_REGION }}
          unset-current-credentials: true
          mask-aws-account-id: true
          inline-session-policy: >-
            {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":"ecs:DescribeServices","Resource":"arn:aws:ecs:${{ vars.AWS_REGION }}:${{ vars.AWS_ACCOUNT_ID }}:service/${{ vars.ECS_CLUSTER }}/${{ vars.ECS_SERVICE }}"}]}
      - name: Verify exact Sandbox role session
        env:
          EXPECTED_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          EXPECTED_ROLE_ARN: ${{ vars.SANDBOX_BACKEND_DEPLOY_ROLE_ARN }}
          EXPECTED_SESSION_NAME: chronote-sandbox-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          aws sts get-caller-identity --output json | node scripts/deployment/assert-sandbox-identity.cjs
      - name: Read Sandbox service counts
        env:
          ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
          ECS_SERVICE: ${{ vars.ECS_SERVICE }}
        run: |
          set -euo pipefail
          aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" --output json | node -e '
            const assert = require("node:assert/strict");
            try {
              const response = JSON.parse(require("node:fs").readFileSync(0, "utf8"));
              assert.deepEqual(response.failures, []);
              assert.equal(response.services.length, 1);
              const service = response.services[0];
              assert.equal(service.serviceName, process.env.ECS_SERVICE);
              console.log(JSON.stringify({
                desired: service.desiredCount,
                running: service.runningCount,
                pending: service.pendingCount,
              }));
            } catch {
              console.error("Sandbox service lookup failed");
              process.exitCode = 1;
            }
          '
